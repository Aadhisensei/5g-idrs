# 5G Core IDRS -- Phase 1: NWDAF + Protocol Parsers
#
# Deployment target: the 5G-Core VM (192.168.56.10) only. This VM hosts
# every NF except the UPF, so it is the correct vantage point for SBI
# (loopback) and NGAP/PFCP (LAN interface) traffic, matching Figure 3.1
# in the thesis.
#
# All services use network_mode: host because the parsers need to
# capture real interfaces (loopback for SBI, the LAN NIC for
# PFCP/NGAP/GTPv2-C/Diameter) rather than a container-private bridge
# network, and because that also means every service reaches Redis on
# 127.0.0.1 with no service-discovery DNS needed.
#
# Run scripts/detect_interfaces.sh first to generate .env with the
# correct LAN_IFACE for this VM.

services:
  redis:
    image: redis:7-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--port", "6379", "--appendonly", "no"]

  nwdaf:
    build:
      context: .
      dockerfile: nwdaf/Dockerfile
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - NWDAF_PORT=8090
    depends_on:
      - redis
    restart: unless-stopped

  parser-sbi:
    build:
      context: .
      dockerfile: parsers/sbi_http2/Dockerfile
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      - REDIS_HOST=127.0.0.1
      - SBI_IFACE=${SBI_IFACE:-lo}
      - SBI_PORT=7777
    depends_on:
      - redis
    restart: unless-stopped

  parser-pfcp:
    build:
      context: .
      dockerfile: parsers/pfcp/Dockerfile
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      - REDIS_HOST=127.0.0.1
      - PFCP_IFACE=${LAN_IFACE:-eth1}
      - PFCP_PORT=8805
    depends_on:
      - redis
    restart: unless-stopped

  parser-ngap:
    build:
      context: .
      dockerfile: parsers/ngap/Dockerfile
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      - REDIS_HOST=127.0.0.1
      - NGAP_IFACE=${LAN_IFACE:-eth1}
      - NGAP_PORT=38412
    depends_on:
      - redis
    restart: unless-stopped

  parser-nas:
    build:
      context: .
      dockerfile: parsers/nas/Dockerfile
    network_mode: host
    environment:
      - REDIS_HOST=127.0.0.1
    depends_on:
      - redis
      - parser-ngap
    restart: unless-stopped

  parser-gtpv2c:
    build:
      context: .
      dockerfile: parsers/gtpv2c/Dockerfile
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      - REDIS_HOST=127.0.0.1
      - GTP_IFACE=${LAN_IFACE:-eth1}
      - GTP_PORT=2123
    depends_on:
      - redis
    restart: unless-stopped

  parser-diameter:
    build:
      context: .
      dockerfile: parsers/diameter/Dockerfile
    network_mode: host
    cap_add: ["NET_ADMIN", "NET_RAW"]
    environment:
      - REDIS_HOST=127.0.0.1
      - DIAMETER_IFACE=${LAN_IFACE:-eth1}
      - DIAMETER_PORT=3868
    depends_on:
      - redis
    restart: unless-stopped
